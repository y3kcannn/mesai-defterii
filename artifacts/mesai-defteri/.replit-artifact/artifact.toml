kind = "web"
previewPath = "/"
title = "Mesai Defteri"
description = "Tablet yatay ekranları için çalışan, personel, gün bazlı mesai kayıtları ve bordro hesabı sunan Türkçe PWA."
version = "1.0.0"
id = "artifacts/mesai-defteri"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18599

[services.development]
run = "pnpm --filter @workspace/mesai-defteri run build:pwa && php -S 0.0.0.0:$PORT -t public public/router.php"

[services.production.build]
args = ["pnpm", "--filter", "@workspace/mesai-defteri", "run", "build:pwa"]

[services.production.run]
args = ["php", "-S", "0.0.0.0:18599", "-t", "public", "public/router.php"]

[services.production.run.env]
PORT = "18599"

[services.env]
PORT = "18599"
BASE_PATH = "/"
