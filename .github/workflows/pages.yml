# Mesai Defteri'ni GitHub Pages'e yayınlar (main'e her gönderimde).
name: GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Statik siteyi derle
        run: node artifacts/mesai-defteri/scripts/build.mjs && rm -f artifacts/mesai-defteri/dist/*.php
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: artifacts/mesai-defteri/dist
      - id: deployment
        uses: actions/deploy-pages@v4
