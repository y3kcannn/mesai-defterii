# Mesai Defteri'ni GitHub Pages'e yayınlar (main'e her gönderimde).
# Derleme bağımlılıksız bir Node betiğidir: npm/pnpm kurulumu yok, runner'daki Node yeterli.
name: GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
# Art arda gönderimlerde sıradaki eski yayın iptal edilir, en son commit yayınlanır.
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Sığ checkout (fetch-depth 1); sürüm numarası $GITHUB_SHA'dan alınır.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Statik siteyi derle
        run: |
          node --version
          node artifacts/mesai-defteri/scripts/build.mjs
          rm -f artifacts/mesai-defteri/dist/*.php
          test -f artifacts/mesai-defteri/dist/index.html && test -f artifacts/mesai-defteri/dist/version.json
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: artifacts/mesai-defteri/dist
      - id: deployment
        uses: actions/deploy-pages@v5
